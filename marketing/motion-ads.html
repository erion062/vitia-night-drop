let selected=0,playing=false,start=0,current=0;
const scrub=document.getElementById('scrub'),music=document.getElementById('music'),play=document.getElementById('play');
function show(){renderFrame(current,selected);scrub.value=current;document.getElementById('status').textContent=`${current.toFixed(2)} / ${durations[selected].toFixed(2)} s`}
function pause(){playing=false;music.pause();play.textContent='Luaj'}
document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{pause();selected=Number(b.dataset.ad);current=0;music.src=`video-ads/vnd-beat-${durations[selected]}s.wav`;scrub.max=durations[selected]-1/30;document.querySelectorAll('[data-ad]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('download').href=`video-ads/${names[selected]}.mp4`;show()});
scrub.oninput=()=>{pause();current=Number(scrub.value);music.currentTime=current;show()};
play.onclick=async()=>{if(playing)return pause();if(current>=durations[selected]-1/30)current=0;music.currentTime=current;try{await music.play()}catch{}start=performance.now()-current*1000;playing=true;play.textContent='Pauzë';requestAnimationFrame(tick)};
function tick(now){if(!playing)return;current=Math.min(durations[selected]-1/30,(now-start)/1000);show();if(current>=durations[selected]-1/30)pause();else requestAnimationFrame(tick)}
window.assetsReady.then(()=>document.querySelector(`[data-ad="${campaign?5:3}"]`).click()).catch(error=>{document.getElementById('status').textContent=error.message});
