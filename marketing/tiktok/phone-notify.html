<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>VND notify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 390px; height: 844px; background: #050505; overflow: hidden; font-family: "Segoe UI", Inter, system-ui, sans-serif; color: #fff; }
    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% 18%, rgba(0,255,102,.22), transparent 58%),
        #050505;
    }
    .bar { padding: 14px 22px 0; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; opacity: .85; }
    .time-wrap { text-align: center; padding-top: 78px; }
    .time { font-size: 92px; font-weight: 200; letter-spacing: -4px; line-height: 1; }
    .date { margin-top: 6px; font-size: 17px; font-weight: 600; color: #cfcfcf; }
    .card {
      margin: 54px 18px 0;
      background: rgba(22,22,22,.82);
      border: 1px solid rgba(0,255,102,.35);
      border-radius: 28px;
      padding: 16px 16px 18px;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 40px rgba(0,255,102,.18);
    }
    .row { display: flex; gap: 12px; align-items: center; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px; background: #121212;
      display: grid; place-items: center; border: 1px solid rgba(0,255,102,.5);
    }
    .mark svg { width: 30px; height: 12px; }
    .meta b { display: block; font-size: 15px; }
    .meta span { font-size: 12px; color: #9a9a9a; }
    .now { margin-left: auto; font-size: 12px; color: #00ff66; font-weight: 700; }
    .msg { margin-top: 12px; font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
    .sub { margin-top: 4px; font-size: 14px; color: #00ff66; font-weight: 700; }
  </style>
</head>
<body>
  <div class="bar"><span>Viti</span><span>100%</span></div>
  <div class="time-wrap">
    <div class="time">22:14</div>
    <div class="date">E mërkurë, 30 shtator</div>
  </div>
  <div class="card">
    <div class="row">
      <div class="mark">
        <svg viewBox="0 0 106 40"><g transform="translate(12 0) skewX(-16.7)"><path fill="#00FF66" fill-rule="evenodd" d="M0 0H9L15 24L21 0H30L20 40H10Z M32 40V0H41L51 22V0H60V40H51L41 18V40Z M63 0H83L93 10V30L83 40H63Z M72 8V32H79L84 27V13L79 8Z"/></g></svg>
      </div>
      <div class="meta"><b>VND</b><span>Vitia Night Drop</span></div>
      <div class="now">tani</div>
    </div>
    <div class="msg">Operatori ta sjell tani</div>
    <div class="sub">te dera · pagesa në dorëzim</div>
  </div>
</body>
</html>
